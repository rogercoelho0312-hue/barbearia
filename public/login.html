<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Barbearia Agenda Pro | Login</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container nav">
        <div class="brand">Barbearia Agenda Pro</div>
        <nav>
          <a href="/">Página inicial</a>
          <a href="/agendar">Agendar</a>
        </nav>
      </div>
    </header>

    <main class="container page auth-page">
      <section class="card login-card">
        <p class="eyebrow">Área administrativa</p>
        <h1>Login do estabelecimento</h1>

        <form id="login-form" class="stacked-form">
          <div class="field">
            <label for="login-username">Usuário</label>
            <input id="login-username" type="text" name="username" placeholder="Digite seu usuário" autocomplete="username" required />
          </div>
          <div class="field">
            <label for="login-password">Senha</label>
            <div class="password-wrap">
              <input id="login-password" type="password" name="password" placeholder="Digite sua senha" autocomplete="current-password" required />
              <button type="button" id="toggle-password" class="password-toggle" aria-label="Mostrar senha">Mostrar</button>
            </div>
          </div>
          <button type="submit" class="primary-btn">Entrar no painel</button>
        </form>

        <div id="login-message" class="message" aria-live="polite"></div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
