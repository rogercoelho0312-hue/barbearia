<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Painel administrativo de agenda para barbearias e salões locais." />
    <title>Barbearia Agenda Pro | Administrador</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container nav">
        <div class="brand">Barbearia Agenda Pro</div>
        <nav>
          <a href="/">Início</a>
          <a href="/agendar">Agendar</a>
          <a href="/login">Login</a>
          <a href="/admin">Admin</a>
        </nav>
      </div>
    </header>

    <main class="container page admin-page">
      <section class="admin-header">
        <div>
          <p class="eyebrow">Painel do estabelecimento</p>
          <h1>Gestão da agenda e faturamento</h1>
        </div>
        <div class="date-picker-wrap">
          <label for="dashboard-date">Selecionar dia</label>
          <input id="dashboard-date" type="date" />
        </div>
      </section>

      <section class="stats-grid">
        <article class="stat-card">
          <span>Total de agendamentos</span>
          <strong id="total-appointments">0</strong>
        </article>
        <article class="stat-card accent">
          <span>Faturamento</span>
          <strong id="total-revenue">R$ 0,00</strong>
        </article>
      </section>

      <div id="global-message" class="message" aria-live="polite"></div>

      <section class="admin-grid">
        <div class="card admin-card">
          <h3>Cadastrar serviço</h3>
          <form id="service-form" class="stacked-form">
            <input type="text" name="name" placeholder="Nome do serviço" required />
            <input type="number" name="duration" placeholder="Duração em minutos" required />
            <input type="number" step="0.01" name="price" placeholder="Preço" required />
            <input type="text" name="category" placeholder="Categoria" />
            <button type="submit" class="primary-btn">Salvar serviço</button>
          </form>
        </div>

        <div class="card admin-card">
          <h3>Bloquear horário</h3>
          <form id="block-form" class="stacked-form">
            <select id="block-professional" name="professionalId" required></select>
            <input type="date" name="date" id="block-date" required />
            <input type="time" name="time" required />
            <input type="text" name="reason" placeholder="Motivo do bloqueio" />
            <button type="submit" class="secondary-btn">Bloquear</button>
          </form>
        </div>
      </section>

      <section class="card">
        <div class="list-header">
          <h3>Agenda do dia</h3>
          <div class="list-actions">
            <button id="reset-day" class="secondary-btn danger-btn" type="button">Reiniciar agenda do dia</button>
            <button id="send-reminders" class="secondary-btn">Enviar lembretes</button>
          </div>
        </div>
        <div id="agenda" class="agenda-list"></div>
      </section>
    </main>

    <script src="/app.js?v=2026-09-28-2"></script>
  </body>
</html>
